<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#245b4b" />
    <meta
      name="description"
      content="함께 쓰는 돈을 한눈에. 우리집 가용금액, 예산, 거래내역을 기기 안에서 안전하게 관리하는 리치콕."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="리치콕" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/pwa-install.css" />
    <title>RichKkok · 리치콕</title>
  </head>
  <body>
    <a href="#main" class="skip-link">본문으로 건너뛰기</a>
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="리치콕 홈"
        ><img
          src="assets/icons/favicon.svg"
          width="38"
          height="38"
          alt=""
        /><span>RichKkok<small>함께 모으는 여유</small></span></a
      >
      <nav id="navigation" aria-label="주 메뉴"></nav>
      <div class="sidebar-bottom">
        <span class="local-dot"></span
        ><span id="storage-status" role="status">이 기기에 저장</span>
        <p>우리집만의 작은 재무실</p>
      </div>
    </aside>
    <div class="workspace">
      <div
        id="install-banner"
        class="install-banner"
        role="region"
        aria-label="리치콕 앱 설치"
        hidden
      >
        <div class="install-banner-copy">
          <img src="assets/icons/icon-192.png" alt="" />
          <span
            ><strong>리치콕을 앱으로 설치</strong
            ><small id="install-banner-detail"
              >홈 화면에서 바로 열고 오프라인에서도 사용할 수 있어요.</small
            ></span
          >
        </div>
        <div class="install-banner-actions">
          <button id="install-app" class="btn primary install-banner-button" type="button">
            설치
          </button>
          <button
            id="dismiss-install"
            class="install-banner-dismiss"
            type="button"
            aria-label="설치 안내 나중에 보기"
          >
            나중에
          </button>
        </div>
      </div>
      <div id="demo-banner" class="demo-banner" hidden>
        <span>가상 데이터로 둘러보는 중 · 실제 기록과 분리되어 있어요</span
        ><button type="button" data-action="exit-sample">샘플 종료</button>
      </div>
      <div id="update-banner" class="update-banner" hidden>
        <span>새로운 리치콕이 준비됐어요. 저장한 기록은 유지돼요.</span
        ><button id="apply-update" type="button">새 버전 적용</button>
      </div>
      <header class="app-header" id="app-header">
        <div class="header-title">
          <span class="eyebrow">OUR HOUSEHOLD</span>
          <h1 id="month-title">우리집</h1>
        </div>
        <div class="header-actions">
          <label class="month-control"
            ><span class="sr-only">조회 월</span
            ><input
              type="month"
              id="month-picker"
              aria-label="조회 월" /></label
          ><button
            class="btn primary import-entry"
            type="button"
            data-action="go-import"
            aria-label="내역 가져오기"
          >
            <span aria-hidden="true">↥</span><span>내역 가져오기</span>
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div class="loading-state">리치콕을 준비하고 있어요…</div>
      </main>
      <footer class="app-footer">
        RichKkok <span>·</span> 조금씩, 함께 만드는 여유
      </footer>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <input type="file" id="restore-file" accept=".json,.richkkok" hidden />
    <noscript
      >리치콕은 기기 안에서 데이터를 처리하기 위해 JavaScript가 필요해요.
      브라우저 설정에서 JavaScript를 켜 주세요.</noscript
    >
    <script type="module" src="js/app.js"></script>
  </body>
</html>
