name: RichKkok quality checks
on:
  push:
    branches: [main, feat/pay-cycle-dashboard-20261008, feat/cash-reconciliation-20261008, feat/payday-amounts-20261008, feat/focused-home-20261008]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: richkkok-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/vendor.mjs
      - run: pnpm run check
      - run: pnpm test
      - name: Install isolated browser test driver
        run: npm install --prefix "$RUNNER_TEMP/richkkok-browser" --no-audit --no-fund playwright@1.51.1
      - name: Install Korean system font for visual verification
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Browser regression (synthetic local data only)
        run: |
          node qa/rename-browser.mjs
          node qa/adaptive-entry-browser.mjs
          node qa/money-browser.mjs
          node qa/cash-browser.mjs
          node qa/income-browser.mjs
          node qa/income-reconcile-browser.mjs
          node qa/focus-browser.mjs
          node qa/instrument-browser.mjs
          node qa/instrument-history-browser.mjs
          node qa/instrument-cleanup-browser.mjs
          node qa/invite-browser.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/richkkok-browser/node_modules/playwright/index.mjs
      - name: Save browser verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: qa-results
          retention-days: 7
      - run: pnpm run build
      - name: Generate matching offline cache on same-repo verification branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- sw.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sw.js
            git commit -m "build: refresh verified offline cache"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Verify committed offline release matches source
        run: git diff --exit-code -- sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: validated-static-site
          path: dist
          retention-days: 7
# Pages publishes main / (root); feature branches are test-only.
