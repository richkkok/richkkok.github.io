name: RichKkok quality checks
on:
  push:
    branches: [main, feat/pay-cycle-dashboard-20261008, feat/cash-reconciliation-20261008]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: richkkok-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/vendor.mjs
      - run: pnpm run check
      - run: pnpm test
      - name: Install isolated browser test driver
        run: npm install --prefix "$RUNNER_TEMP/richkkok-browser" --no-audit --no-fund playwright@1.51.1
      - name: Install Korean system font for visual verification
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Browser regression (synthetic local data only)
        run: |
          node qa/money-browser.mjs
          node qa/cash-browser.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/richkkok-browser/node_modules/playwright/index.mjs
      - name: Save browser verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: qa-results
          retention-days: 7
      - run: pnpm run build
      - name: Verify committed offline release matches source
        run: git diff --exit-code -- sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: validated-static-site
          path: dist
          retention-days: 7
# Pages publishes main / (root); feature branches are test-only.
