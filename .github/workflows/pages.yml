name: RichKkok quality checks
on:
  push:
    branches: [main, feat/pay-cycle-dashboard-20261008]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: richkkok-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot feature source for isolated local verification
        if: github.ref == 'refs/heads/feat/pay-cycle-dashboard-20261008'
        uses: actions/upload-artifact@v4
        with:
          name: feature-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/vendor.mjs
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
      - name: Verify committed offline release matches source
        run: git diff --exit-code -- sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: validated-static-site
          path: dist
          retention-days: 7
# Pages publishes main / (root); feature branches are test-only.
